name: Extract WordPress Hooks

on:
  push:
    branches: [main]
    paths:
      - '**.php'
  workflow_dispatch:

jobs:
  extract-hooks:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Required to push to wiki repository
    steps:
      - uses: actions/checkout@v7
      - uses: akirk/extract-wp-hooks@c0b59d9607347a0390627756c095c52d5f98016a # 1.4.0
        with:
          namespace: 'Socialspec'
          wiki-directory: '../wordpress-socialspec.wiki'
          github-blob-url: 'https://github.com/socialspec/wordpress-socialspec/blob/main/'
          example-style: 'prefixed'
          exclude-dirs: 'node_modules,tests,vendor'
